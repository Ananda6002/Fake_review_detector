<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Review Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Styling variables matched to the main dashboard */
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(22, 28, 45, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-violet: #8b5cf6;
      --accent-violet-glow: rgba(139, 92, 246, 0.35);
      --color-emerald: #10b981;
      --color-red: #ef4444;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      padding: 18px;
      overflow: hidden;
    }

    /* Glowing accent background */
    .glow-bg {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, var(--accent-violet) 0%, transparent 70%);
      filter: blur(40px);
      opacity: 0.25;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-violet), #4f46e5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 0 12px var(--accent-violet-glow);
    }

    .header-text h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #d8b4fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .control-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .control-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .label-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .label-desc {
      font-size: 10px;
      color: var(--text-secondary);
    }

    /* Modern Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-secondary);
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-violet);
      border-color: var(--accent-violet);
      box-shadow: 0 0 10px var(--accent-violet-glow);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #ffffff;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
      display: inline-block;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background-color: var(--color-emerald);
      box-shadow: 0 0 8px var(--color-emerald);
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      margin-top: 4px;
    }

    .footer a {
      color: var(--accent-violet);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: #a855f7;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="container">
    <div class="header">
      <div class="logo-icon">AI</div>
      <div class="header-text">
        <h1>AI Review Detector</h1>
        <p>NLP Classification System</p>
      </div>
    </div>

    <div class="control-card">
      <div class="control-label">
        <span class="label-title">Auto-Detection</span>
        <span class="label-desc">Scan reviews on load</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-detector" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="status-indicator">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Detection is active</span>
    </div>

    <div class="footer">
      Powered by Local AI Model &bull; <a href="http://127.0.0.1:8000" target="_blank">Dashboard</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
